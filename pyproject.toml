[project]
name = "streamlitgo"
dynamic = ["version"]
description = ""
authors = [{ name = "paleneutron", email = "paleneutron@outlook.com" }]
requires-python = ">=3.8.1,!=3.9.7"
readme = "README.md"
dependencies = ["streamlit>=1.23"]

[project.scripts]
streamlitgo = "streamlitgo.cli:main"

[dependency-groups]
dev = [
    "flake8>=7.0.0,<8",
    "pytest>=8.0.2,<9",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["streamlitgo"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.flake8]
exclude = ".venv"

# add --capture=tee-sys option to pytest
[tool.pytest.ini_options]
addopts = "--capture=tee-sys"
